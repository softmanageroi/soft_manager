<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data backup | IMS</title><style>body{max-width:720px;margin:60px auto;padding:0 20px;background:#f7f8fc;color:#172033;font:16px/1.5 system-ui,sans-serif}main{padding:32px;background:#fff;border:1px solid #e5e7eb;border-radius:14px}h1{margin-top:0}button,a{display:inline-block;margin:8px 8px 0 0;padding:10px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}button.secondary,a.secondary{background:#edf2ff;color:#2446a8}p{color:#667085}input{display:none}</style></head><body><main><h1>Warehouse data backup</h1><p>Download a copy of the warehouse stock stored in this browser, or restore a previously downloaded backup.</p><button id="export">Download backup</button><label for="import" class="secondary">Restore backup</label><input id="import" type="file" accept="application/json"><a href="warehouse-stock.html" class="secondary">Back to stock</a><p id="message" role="status"></p></main><script>(()=>{'use strict';const key='ims.warehouse-stock.v1',message=document.getElementById('message');document.getElementById('export').onclick=()=>{const content=localStorage.getItem(key)||'[]',blob=new Blob([content],{type:'application/json'}),link=Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:'warehouse-stock-backup.json'});link.click();URL.revokeObjectURL(link.href);message.textContent='Backup downloaded.'};document.getElementById('import').onchange=async event=>{const file=event.target.files[0];if(!file)return;try{const value=JSON.parse(await file.text());if(!Array.isArray(value))throw new Error();localStorage.setItem(key,JSON.stringify(value));message.textContent='Backup restored successfully.'}catch{message.textContent='This file is not a valid warehouse-stock backup.'}}})()</script></body></html>
