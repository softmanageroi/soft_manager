services:
  - type: web
    name: soft-manager
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: APP_USERNAME
        value: admin
      - key: APP_PASSWORD
        generateValue: true
