<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Material Issue List</title>
    <link rel="stylesheet" href="../css/purchase.css" />
    <link rel="stylesheet" href="../css/ims-flow.css" />
    <link rel="stylesheet" href="../css/common-header.css" />
    <link rel="stylesheet" href="../css/skeuomorphic.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>
<body class="purchase-voucher-page">
    <header class="top-strip">
        <div class="brand"><i class="fa-solid fa-cubes-stacked" aria-hidden="true"></i> Soft Manager</div>
        <div class="search">
            <input id="searchBox" type="search" placeholder="Menu Search" aria-label="Menu Search">
            <ul id="searchResults" class="search-dropdown"></ul>
        </div>
        <div class="top-actions">
            <a class="top-home" href="dashboard.html"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Dashboard</span></a>
            <a id="topUserLink" class="top-user" href="index.html" aria-label="Login"><i class="fa-solid fa-user" aria-hidden="true"></i><span id="topUserLabel">Login</span></a>
        </div>
    </header>
    <main class="inventory-page">
        <header class="voucher-header">
            <div>
                <div class="breadcrumb-title">Material Issue Vouchers</div>
                <div class="breadcrumb-path">Inventory → Material Issue → Voucher List</div>
            </div>
            <div class="voucher-actions">
                <a class="toolbar-btn" href="dashboard.html">Dashboard</a>
            </div>
        </header>

        <div id="issueListView">
            <div class="ims-tabs" role="tablist">
                <button id="tabAllIssue" class="tab active" type="button" role="tab" aria-controls="issueAllView" aria-selected="true">All Vouchers</button>
                <button id="tabPendingIssue" class="tab" type="button" role="tab" aria-controls="issuePendingView" aria-selected="false">Pending Vouchers</button>
            </div>
            <p id="issueListMessage" class="ims-message" role="status" aria-live="polite" hidden></p>
            
            <section id="issueAllView" class="voucher-table-card" role="tabpanel" aria-labelledby="tabAllIssue" tabindex="0">
                <div class="voucher-card-header"><h2>All Vouchers (<span id="issueCount">0</span>)</h2></div>
                <div class="voucher-table-wrapper">
                    <table class="voucher-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Voucher No.</th>
                                <th>Date</th>
                                <th>Department</th>
                                <th>Requested By</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="issueAllBody"></tbody>
                    </table>
                </div>
            </section>

            <section id="issuePendingView" class="voucher-table-card" role="tabpanel" aria-labelledby="tabPendingIssue" tabindex="0" hidden>
                <div class="voucher-card-header"><h2>Pending Vouchers (<span id="issuePendingCount">0</span>)</h2></div>
                <div class="voucher-table-wrapper">
                    <table class="voucher-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Draft/Req No.</th>
                                <th>Date</th>
                                <th>Department</th>
                                <th>Requested By</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="issuePendingBody"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
    <script src="../js/ims-store.js"></script>
    <script src="../js/searchText.js"></script>
    <script src="../js/header-user.js"></script>
    <script src="../js/material-issue-list.js"></script>
    <script src="../js/voucher-toolbar.js"></script>
</body>
</html>
