<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/skeuomorphic.css?v=4">
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>IMS Login</title>
</head>


<body>
      <form id="loginForm" class="login-box">
                  <h2>Login</h2>
                  <input id="username" name="username" type="text" placeholder="Enter username" autocomplete="username" required>
                  <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
                  <button id="LoginButton" class="button" type="submit">Sign in</button>
                  <p id="loginMessage" role="alert" aria-live="polite" hidden></p>
      </form>
      <script src="../js/login.js"></script>
</body>
</html>
