<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/skeuomorphic.css">
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>IMS Login</title>
</head>


<body>
      <form id="loginForm" class="login-box">
                  <h2>Login</h2>
                 <input id="username" type="text" placeholder="Enter username" autocomplete="username">
                 <input id="password" type="password" placeholder="Enter password" autocomplete="current-password">
                 <button id="LoginButton" class="button" type="submit">Sign in</button>
      </form>
      <script src="../js/login.js"></script>
</body>
</html>
