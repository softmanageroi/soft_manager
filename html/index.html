<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMS Login</title>
    <link rel="stylesheet" href="css/skeuomorphic.css?v=4">
    <link rel="stylesheet" href="css/index.css?v=20261107-light-login-2">
</head>
<body>
    <aside class="login-promo">
        <div class="promo-brand">
            <svg viewBox="0 0 48 48" aria-hidden="true">
                <path d="M24 2 44 13.5v21L24 46 4 34.5v-21L24 2Z" fill="#6038df"/>
                <path d="m24 2 20 11.5L24 25 4 13.5 24 2Z" fill="#9678ff"/>
                <path d="M4 13.5 24 25v21L4 34.5v-21Z" fill="#7045ed"/>
                <path d="M44 13.5 24 25v21l20-11.5v-21Z" fill="#542bd5"/>
            </svg>
            <span>Inventory ERP</span>
        </div>
        <p class="promo-eyebrow">PURCHASE &amp; INVENTORY</p>
        <h2>Everything you need,<br>all in one place.</h2>
        <p class="promo-description">Manage purchases, stock and vouchers with a clearer view of your business.</p>
        <div class="promo-features">
            <span>Purchase</span>
            <span>Inventory</span>
            <span>Reports</span>
        </div>
    </aside>
    <form id="loginForm" class="login-box">
        <div class="login-brand" aria-label="Inventory ERP">
            <svg viewBox="0 0 48 48" aria-hidden="true">
                <path d="M24 2 44 13.5v21L24 46 4 34.5v-21L24 2Z" fill="#6038df"/>
                <path d="m24 2 20 11.5L24 25 4 13.5 24 2Z" fill="#9678ff"/>
                <path d="M4 13.5 24 25v21L4 34.5v-21Z" fill="#7045ed"/>
                <path d="M44 13.5 24 25v21l20-11.5v-21Z" fill="#542bd5"/>
            </svg>
            <span>Inventory ERP</span>
        </div>
        <h1>Login to Your Account</h1>
        <p class="login-subtitle">Enter your credentials to access the system</p>

        <label class="login-field">
            <span class="visually-hidden">Username</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4 21v-2a8 8 0 0 1 16 0v2"></path>
            </svg>
            <input id="username" name="username" type="text" placeholder="Username" autocomplete="username" required>
        </label>
        <label class="login-field">
            <span class="visually-hidden">Password</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                <path d="M8 10V7a4 4 0 1 1 8 0v3"></path>
                <circle cx="12" cy="15" r="1"></circle>
            </svg>
            <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
        </label>
        <button id="LoginButton" class="button" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10 17l5-5-5-5M15 12H3"></path>
                <path d="M12 3h6a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-6"></path>
            </svg>
            Login
        </button>
        <p id="loginMessage" role="alert" aria-live="polite" hidden></p>
        <p style="text-align: center; margin: 0;"><a href="data-backup.html">Backup or restore data</a></p>
    </form>
    <script src="../js/login.js?v=20261107-restore-pending-navigation"></script>
</body>
</html>
